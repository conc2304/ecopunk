# OC-003 personal-installation profile: all six observations (FX/RAW x AVG/DOM/VIB) ON in normal living-room operation.
# systemd drop-in for the EXISTING unit ecopunk-runtime (the unit file itself is device-owned and not in this repository).
# Install as /etc/systemd/system/ecopunk-runtime.service.d/50-oc003-color.conf  (outside the deployed source tree, so
# scripts/deploy.sh -- including --clean -- never touches it). Procedure: docs/reviews/OC-003-personal-installation-profile.md
#
# Only variables the runtime already reads. Deliberately NOT set (so they stay at their canonical default = off):
#   EXPERIENCE_RUNTIME_SCENE_COLOR_READBACK (experimental RGBA16F; unset = RGBA32F baseline)
#   EXPERIENCE_RUNTIME_SCENE_VISUAL_ACTIVITY / _SCENE_ACTIVITY_PROBE (OC-004)
#   EXPERIENCE_RUNTIME_FRAME_PHASE_* (high-volume frame logging), *_STATS, *_DIAG, *_HARNESS, *_FAULT, *_FALLBACK
# The 2 Hz cadence is a compiled constant (scenecolor::kNominalPeriodSeconds) and is not configurable.
[Service]
Environment=EXPERIENCE_RUNTIME_SCENE_COLOR=1
Environment=EXPERIENCE_RUNTIME_SCENE_COLOR_MODE=deferred
Environment=EXPERIENCE_RUNTIME_SCENE_COLOR_DEFER=fence
Environment=EXPERIENCE_RUNTIME_SCENE_COLOR_DEFER_FLUSH=1
Environment=EXPERIENCE_RUNTIME_VIDEO_COLOR=1
Environment=EXPERIENCE_RUNTIME_VIDEO_COLOR_MODE=deferred
Environment=EXPERIENCE_RUNTIME_PREDOMINANT_COLOR=1

# OC-003 KILL SWITCH: turns ALL colour instrumentation off (FX and RAW sampling, DOM/VIB). Sorts after 50-oc003-color.conf,
# so its later assignments win. Install as /etc/systemd/system/ecopunk-runtime.service.d/90-oc003-color-off.conf, then
# daemon-reload + restart. Roll back by deleting this file (restores the 50- profile) -- see the procedure document.
# Note: with no variable set the canonical default is NOT "off": FX AVG would still run (synchronous). This file is
# what makes it off; Orbit shows the affected observations as NOT AVAILABLE.
[Service]
Environment=EXPERIENCE_RUNTIME_SCENE_COLOR=0
Environment=EXPERIENCE_RUNTIME_VIDEO_COLOR=0
Environment=EXPERIENCE_RUNTIME_PREDOMINANT_COLOR=0
